<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review46 Admin</title>
<style>
  body { margin:0; font:14px/1.5 system-ui, "Segoe UI", sans-serif; background:#f4f5f7; color:#1c2733; }
  header { padding:10px 16px; background:#1c2733; color:#fff; display:flex; gap:16px; align-items:center; }
  header h1 { font-size:15px; margin:0; }
  main { max-width:1180px; margin:0 auto; padding:14px; }
  .card { background:#fff; border:1px solid #dde3ea; border-radius:10px; padding:12px 14px; margin-bottom:12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:10px; }
  .stat { background:#f8fafc; border:1px solid #e4e9ef; border-radius:8px; padding:8px 10px; }
  .stat b { display:block; font-size:20px; }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  th, td { border-bottom:1px solid #e4e9ef; padding:5px 8px; text-align:left; }
  tr:hover { background:#f4f8fd; }
  /* same reusable RTL prose contract as the reviewer page: word-wrapping
     only (never per-character), stored line breaks preserved, browser bidi
     handles mixed Hebrew+English, and the column can never be squeezed. */
  .he { direction:rtl; text-align:right; white-space:pre-wrap;
        overflow-wrap:break-word; word-break:normal; width:100%; min-width:16rem; }
  /* reviewer notes and adjudication text are mixed-direction user input:
     per-paragraph auto direction via the browser's bidi, no string edits */
  #detail li, #detail input[type=text] { unicode-bidi:plaintext; }
  .st-CONSENSUS { color:#1d7a46; font-weight:600; }
  .st-NEEDS_ADJUDICATION { color:#a12727; font-weight:600; }
  .st-ADJUDICATED { color:#2456a6; font-weight:600; }
  .st-STALE_PENDING_RE_REVIEW { color:#b45309; font-weight:600; }
  .st-OWNER_ADJUDICATED_AFTER_REPAIR { color:#6d28d9; font-weight:600; }
  .ownerq { background:#fff7ed; border:1px solid #fdba74; }
  .stalebox { background:#f8f8f8; border:1px dashed #cbd5df; border-radius:6px;
              padding:6px 10px; color:#5b6b7b; }
  .banner { background:#fff7ed; border:1px solid #fdba74; border-radius:8px;
            padding:8px 10px; margin:8px 0; }
  #detail img { max-width:100%; border:1px solid #dde3ea; border-radius:6px; margin:4px 0; display:block; }
  button { font:inherit; padding:6px 10px; border-radius:7px; border:1px solid #cfd7e0; background:#fff; cursor:pointer; }
  #detail { position:fixed; right:0; top:0; bottom:0; width:min(660px,92vw); background:#fff;
            border-left:1px solid #cfd7e0; overflow:auto; padding:14px; display:none; z-index:9; }
  .mut { color:#5b6b7b; }
  pre { background:#f6f8fa; border:1px solid #e4e9ef; border-radius:6px; padding:8px; overflow:auto; font-size:12px; }
</style>
</head>
<body>
<header><h1>SEEN-46 blind review — admin</h1>
  <button onclick="load()">refresh</button>
  <button onclick="doExport()">export</button>
  <button onclick="doBackup()">backup</button>
  <button onclick="doCompare()">compare</button>
  <span id="hdr" class="mut" style="color:#cbd5df"></span>
</header>
<main>
  <div class="card"><div id="stats" class="grid"></div></div>
  <div class="card ownerq" id="ownerq" style="display:none"></div>
  <div class="card" id="shadowbox" style="display:none"></div>
  <div class="card"><h3 style="margin:4px 0">Reviewers</h3><div id="reviewers"></div></div>
  <div class="card">
    <h3 style="margin:4px 0">Cases</h3>
    <label>filter state: <select id="statef" onchange="renderItems()">
      <option value="">all</option><option>PENDING</option><option>ONE_REVIEW</option>
      <option>CONSENSUS</option><option>NEEDS_ADJUDICATION</option><option>ADJUDICATED</option>
      <option>STALE_PENDING_RE_REVIEW</option><option>OWNER_ADJUDICATED_AFTER_REPAIR</option>
    </select></label>
    <table id="items"><thead><tr><th>case</th><th>state</th><th>reviews</th><th>human ref</th>
      <th>instructor (derived)</th><th>model</th><th>flags</th><th></th></tr></thead><tbody></tbody></table>
  </div>
  <div class="card"><h3 style="margin:4px 0">Comparison</h3><pre id="compare">not requested yet</pre></div>
</main>
<div id="detail"></div>
<script>
"use strict";
let items = [];
async function api(path, body){
  const r = await fetch(path, body===undefined?{}:{method:"POST",
    headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  return {status:r.status, ...(await r.json().catch(()=>({})))};
}
function el(id){ return document.getElementById(id); }
// same guard as reviewer.html: a string passes through UNTOUCHED
// (Object.values on a string yields one entry per character)
function asText(v){
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (Array.isArray(v)) return v.join("\n");
  if (typeof v === "object") return Object.values(v).join("\n");
  return String(v);
}

async function load(){
  const s = await api("/api/admin/summary");
  if (s.status >= 400) { el("hdr").textContent = s.error || "auth failed"; return; }
  const st = el("stats"); st.innerHTML = "";
  const cells = [
    ["campaign cases", s.cases], ["required reviews", s.required_reviews],
    ["decisions saved", s.completed_review_decisions],
    ["cases 0 / 1 / 2 reviews", `${s.cases_by_review_count[0]} / ${s.cases_by_review_count[1]} / ${s.cases_by_review_count[2]}`],
    ["reviewer agreement", s.reviewer_agreement.rate_pct === null ? "-" : s.reviewer_agreement.rate_pct + "%"],
    ["needs adjudication", s.needs_adjudication.length],
    ["adjudicated", s.adjudicated],
    ["owner queue (repair)", (s.owner_adjudication_queue||[]).length],
    ["owner-adjudicated (repair)", (s.owner_adjudicated_after_repair||[]).length],
    ["active claims", s.claims_active ?? "-"],
    ["mean review time", s.mean_review_time_s ? s.mean_review_time_s + "s" : "-"],
    ["confidence h/m/l", `${s.confidence_counts.high}/${s.confidence_counts.medium}/${s.confidence_counts.low}`],
    ["issue flags", Object.entries(s.issue_counts).filter(([k,v])=>k!=="none"&&v).map(([k,v])=>`${k}:${v}`).join(" ") || "none"],
    ["campaign complete", s.campaign_complete ? "YES" : "no"],
  ];
  if (s.comparison_preview) cells.push(
    ["model vs human", s.comparison_preview.model_vs_human_pct + "%"],
    ["instructor vs human", s.comparison_preview.instructor_vs_human_pct + "%"],
    ["model vs instructor", s.comparison_preview.model_vs_instructor_pct + "%"]);
  for (const [k,v] of cells){
    const d = document.createElement("div"); d.className="stat";
    d.innerHTML = `<b>${v}</b><span class="mut">${k}</span>`; st.appendChild(d);
  }
  el("reviewers").innerHTML = (s.reviewers||[]).map(r =>
    `<span style="margin-right:14px"><b>${r.name}</b> saved ${r.my_saved ?? 0}, skipped ${r.my_skipped ?? 0}</span>`).join("") || "<span class=mut>none yet</span>";
  const it = await api("/api/admin/items");
  items = it.items || [];
  renderOwnerQueue();
  renderItems();
  loadShadow();
}

async function loadShadow(){
  const box = el("shadowbox");
  const s = await api("/api/admin/shadow");
  if (s.status >= 400) { box.style.display = "none"; return; }
  box.style.display = "block";
  const row = (id, m, scope) => `<tr><td>${id}</td><td>${scope}</td>
    <td>${m.auto} (${m.auto_coverage_pct}%)</td><td>${m.review}</td>
    <td>${m.auto_precision_pct ?? "-"}%</td><td>${m.auto_total_weighted_loss}</td>
    <td>${m.invalid_to_valid_auto}</td><td>${m.partial_to_valid_auto}</td>
    <td>${m.auto_undergrades}</td></tr>`;
  const dep = Object.entries(s.deployable_prospective || {})
    .map(([k, m]) => row(k, m, "PROSPECTIVE")).join("");
  const orc = Object.entries(s.oracle_retrospective_upper_bound || {})
    .map(([k, m]) => row(k, m, "RETROSPECTIVE — NOT DEPLOYABLE")).join("");
  box.innerHTML = `<h3 style="margin:4px 0">Shadow risk-policy diagnostics
      <span class="mut">(mode: ${s.policy_mode}; ${s.engine_version};
      matrix ${s.matrix_name})</span></h3>
    <p class="mut" style="margin:4px 0">${s.shadow_note}</p>
    <table><thead><tr><th>policy</th><th>scope</th><th>AUTO (cov)</th>
      <th>REVIEW</th><th>prec</th><th>AUTO risk</th><th>inv→val</th>
      <th>pv→val</th><th>auto under</th></tr></thead>
    <tbody>${dep}${orc}</tbody></table>
    <p class="mut" style="margin:6px 0 0"><b>⚠ ${s.oracle_warning}</b></p>`;
}

function renderOwnerQueue(){
  const q = items.filter(o => o.state === "STALE_PENDING_RE_REVIEW");
  const box = el("ownerq");
  if (!q.length) { box.style.display = "none"; return; }
  box.style.display = "block";
  box.innerHTML = `<h3 style="margin:4px 0">Owner adjudication queue — ${q.length} case(s)</h3>
    <p class="mut" style="margin:4px 0">These cases were repaired by the confirmed source
    transposition. Their historical reviews are preserved as stale and reviewers will
    <b>not</b> be asked again. Open each case, check the corrected evidence, and assign the
    repaired reference verdict once — it is stored as
    <code>owner_adjudicated_after_source_repair</code>, separate from two-reviewer consensus.</p>
    ${q.map(o => `<button style="margin-right:8px" onclick="openDetail('${o.item_id}')">
      ${o.case_id} — adjudicate</button>`).join("")}`;
}

function renderItems(){
  const f = el("statef").value;
  const tb = el("items").querySelector("tbody"); tb.innerHTML = "";
  for (const o of items){
    if (f && o.state !== f) continue;
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${o.case_id}</td><td class="st-${o.state}">${o.state}</td>
      <td>${o.n_reviews} (${(o.reviewers||[]).join(", ")})</td>
      <td>${o.human_reference_verdict ?? "-"}</td>
      <td>${o.instructor_derived_verdict ?? "-"}${o.evidence_issue_flag ? " ⚑" : ""}</td>
      <td>${o.model_verdict ?? "-"}</td><td>${o.evidence_issue_flag ? "evidence-issue" : ""}</td>
      <td><button onclick="openDetail('${o.item_id}')">open</button></td>`;
    tb.appendChild(tr);
  }
}

async function openDetail(id){
  const d = await api(`/api/admin/items/${id}`);
  const c = d.content || {};
  const rev = (d.reviews||[]).map(r =>
    `<li><b>${r.reviewer}</b>: ${r.verdict ?? r.status} (conf ${r.confidence ?? "-"}, issue ${r.issue ?? "-"})
     ${r.text ? " — " + r.text : ""}${r.flag_reason ? " — FLAG: " + r.flag_reason : ""}</li>`).join("");
  const staleRev = (d.stale_reviews||[]).map(r =>
    `<li><b>${r.reviewer}</b>: ${r.verdict ?? "-"} (conf ${r.confidence ?? "-"})
     — <i>stale: superseded by the confirmed source repair; preserved, never counted</i></li>`).join("");
  const mp = d.model_proposal || {}, ir = d.instructor_reference || {};
  const banner = d.state === "STALE_PENDING_RE_REVIEW" ? `
    <div class="banner"><b>Owner adjudication.</b> The evidence below is the CORRECTED
    (post-repair) source for this case. Assign the repaired reference verdict once — it is
    stored as <code>owner_adjudicated_after_source_repair</code>, never as two-reviewer
    consensus. The historical reviews stay preserved as stale.</div>` : "";
  el("detail").innerHTML = `
    <button onclick="el('detail').style.display='none'">close</button>
    <h3>${d.case_id} <span class="st-${d.state}">${d.state}</span></h3>
    ${banner}
    <p class="he">${asText(c.question_text)}</p>
    <h4>Corrected evidence (crops)</h4>
    ${(c.images||[]).map(u => `<img src="${u}" alt="evidence crop">`).join("") || "<p class=mut>no crops</p>"}
    ${(c.provenance && c.provenance.page_url) ? `<p><a href="${c.provenance.page_url}" target="_blank">open full source page</a></p>` : ""}
    <h4>Transcription (post-repair)</h4>
    <p class="he" style="background:#fffbe8;padding:6px">${asText(c.transcription)}</p>
    <h4>Official solution</h4>
    <p class="he">${asText(c.official_solution)}</p>
    <h4>Independent reviews (fresh)</h4><ul>${rev || "<li class=mut>none</li>"}</ul>
    ${staleRev ? `<h4>Historical reviews (stale)</h4><div class="stalebox"><ul>${staleRev}</ul></div>` : ""}
    <h4>Original instructor (reference)</h4>
    <pre>${JSON.stringify(ir, null, 1)}</pre>
    <h4>Local model proposal (frozen)</h4>
    <pre>${JSON.stringify(mp, null, 1)}</pre>
    <h4>Adjudicate</h4>
    <p>verdict:
      <select id="adjv"><option>valid</option><option>partially_valid</option><option>invalid</option></select>
      note: <input id="adjn" type="text" style="width:220px">
      <button onclick="adjudicate('${id}', ${d.item_revision})">save adjudication</button>
      <button onclick="reopen('${id}')">reopen</button></p>
    ${d.adjudicated ? `<pre>${JSON.stringify(d.adjudicated, null, 1)}</pre>` : ""}`;
  el("detail").style.display = "block";
}

async function adjudicate(id, revision){
  const r = await api(`/api/admin/items/${id}/adjudicate`,
    {verdict: el("adjv").value, note: el("adjn").value, adjudicator: "admin",
     expected_item_revision: revision});
  if (r.status >= 400) alert(r.error || "failed"); else { el("detail").style.display="none"; load(); }
}
async function reopen(id){
  const r = await api(`/api/admin/items/${id}/reopen`, {});
  if (r.status >= 400) alert(r.error || "failed"); else { el("detail").style.display="none"; load(); }
}
async function doExport(){
  const r = await fetch("/api/admin/export");
  const j = await r.json();
  el("compare").textContent = "export written (X-Export-Path header on the response); "
    + (j.cases ? j.cases.length + " cases" : JSON.stringify(j).slice(0, 200));
}
async function doBackup(){
  const r = await api("/api/admin/backup", {});
  alert(r.status < 400 ? "backup OK" : (r.error || "backup failed"));
}
async function doCompare(){
  const r = await api("/api/admin/compare" + (confirm("Campaign complete? OK = full, Cancel = explicitly-partial preview") ? "" : "?partial=1"));
  el("compare").textContent = JSON.stringify(r, null, 1);
}
load();
</script>
</body>
</html>
