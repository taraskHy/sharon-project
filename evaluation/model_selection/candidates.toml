# Model-selection candidate registry — CANDIDATES ONLY, no winners.
#
# This file is DATA for the model-selection phase, not grading logic. Model
# slugs (and any prices you note alongside them) are mutable external facts:
# they may change or disappear, and promotional pricing must never be baked
# into code. The final winner for every role is selected EMPIRICALLY by the
# benchmark protocols in docs/model-selection.md, run through ModelGateway
# under the experiment budget in this file's [budget] section — never by
# default, preference, or vendor loyalty.
#
# status values:
#   UNSELECTED      no winner chosen; cloud runs needing this role must refuse
#   SELECTED_LOCAL  a local deterministic/model route is the standing choice
#
# Wiring: each role maps to a ModelGateway task + the ${ENV} slug that
# models.toml reads. "UNSELECTED" is expressed operationally by leaving the
# task's env slug unset / the task unconfigured — the gateway then fails
# loudly at construction and the run refuses before any exam is graded.

[meta]
version = 1
updated = "2026-08-21"
rule = "no candidate becomes a production default without a recorded benchmark run (dataset role, config hash, prompt version, model, results)"

# ---- experiment budget for ALL future OpenRouter model-selection runs ----
# Hard ceiling across the whole project’s experimental spend, enforced via
# the gateway budget config (see docs/model-selection.md §budget): no call
# may execute if predicted/known cumulative spend would cross the ceiling.
[budget]
experiment_total_usd = 10.00
warn_usd = 8.00

[roles.ocr_primary]
status = "UNSELECTED"
gateway_task = "ocr_primary"
env_slug = "OCR_PRIMARY_MODEL"
vision = true
candidates = [
    "google/gemini-3.7-flash",
    "openai/gpt-5.6-luna",
    # owner-named stage-1 OCR smoke candidate (2026-09-02): the priced
    # ``-pro`` slug; ``gpt-5.6-luna`` above is unpriced and cannot run live
    "openai/gpt-5.6-luna-pro",
    "anthropic/claude-sonnet-5",
]
benchmark = "B1 OCR (frozen hebrew_bench_v2 protocol)"

# Stage-1b (2026-09-02). The Stage-1 smoke sent this model the ocr_primary
# production route's reasoning={"effort":"none"} and every one of its 8
# requests was rejected pre-inference with HTTP 400 "Reasoning is mandatory
# for this endpoint and cannot be disabled" ($0 billed, zero OCR evidence).
# Live model metadata confirms it: reasoning.mandatory=true,
# supported_efforts=["high","medium","low"], default_effort="medium". "low" is
# the LOWEST setting the endpoint accepts, so it is the smallest change that
# makes the arm runnable at all.
#
# max_tokens 600 -> 1000, derived (NOT copied from the grade_primary override,
# whose 1200 would breach this arm's $0.04 ceiling):
#   longest audited reference in the frozen 8 = 116 chars (hc_e002_q2_r6)
#   worst observed visible cost in Stage-1    = 171 tok for 96 chars (1.78 tok/char)
#   scaled to 116 chars                       = 207 tok; x1.2 margin = 247 tok visible
#   mandatory low-effort reasoning allowance  = 1000 - 247 = 753 tok (3x visible)
#   predicted 8-case cost at 1000             = $0.037415 < $0.04 ceiling
# Reasoning tokens bill at the completion rate ($3.75/M, "internal_reasoning"),
# which is why the cap is budget-bound rather than set generously.
[roles.ocr_primary.candidate_overrides."google/gemini-3.7-flash"]
reasoning = { effort = "low" }
max_tokens = 1000
why = "endpoint reports reasoning.mandatory=true and rejects effort=none; 'low' is its lowest supported_effort. max_tokens 600->1000 derived from the longest audited reference (116 chars) and Stage-1's worst observed 1.78 tok/char, leaving 753 tokens for mandatory reasoning; predicted 8-case cost $0.0374 < the $0.04 Stage-1b ceiling."

[roles.ocr_verify]
status = "UNSELECTED"
gateway_task = "ocr_verify"
env_slug = "OCR_VERIFY_MODEL"
vision = true
candidates = [
    "openai/gpt-5.6-luna",
    "anthropic/claude-sonnet-5",
    "google/gemini-3.7-flash",
]
benchmark = "B2 OCR-verifier (image+frozen transcription only)"

