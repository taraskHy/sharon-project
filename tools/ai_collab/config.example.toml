# AI collaboration harness — example config.
# Copy to tools/ai_collab/config.toml (gitignored) and adjust.
# NEVER put API keys here: keys are read from the environment only
# (OPENROUTER_API_KEY / OPENAI_API_KEY) and are never persisted or printed.

[run]
mode = "semi_auto"          # manual | semi_auto | auto_bounded (do not default to auto_bounded)
max_rounds = 3              # hard cap on Claude->review rounds
on_test_failure = "stop"    # stop | review (send failing state to the reviewer anyway)
test_fix_attempts = 1       # bounded in-round fix attempts when orchestrator tests fail

[claude]
mode = "claude_code"        # claude_code (headless CLI) | manual | mock
executable = "claude"
permission_mode = "acceptEdits"
allowed_tools = ["Edit", "Write", "Read", "Glob", "Grep", "Bash(git *)", "Bash(python*)", "Bash(.venv*)"]
timeout_seconds = 3600
# model = "claude-sonnet-5"       # empty -> Claude Code session default
# max_budget_usd = 3.0            # passed to `claude -p --max-budget-usd`
# mock_script = "tools/ai_collab/examples/mock_handoffs.json"

[reviewer]
backend = "openrouter"      # openrouter | openai | mock
model = "${AI_REVIEW_MODEL}"    # env-expanded at load; never hardcode a model id
temperature = 0.0
max_output_tokens = 4000
request_timeout_seconds = 180
max_retries = 1             # extra attempts after a malformed reviewer reply
allow_context_followup = true   # reviewer may request source files once per round
max_context_files = 5
force_json = true           # ask for response_format json_object
# api_base = ""             # endpoint override (rarely needed)
# mock_script = "tools/ai_collab/examples/mock_reviews.json"

[policy]
block_on = ["critical", "high"]  # severities that veto an APPROVED verdict

[budget]                    # hard limits; reaching any -> BUDGET_EXHAUSTED, STOP
max_reviewer_calls = 8
max_input_tokens = 400000   # estimated (chars/4) when the provider reports none
max_output_tokens = 40000
max_cost_usd = 5.0          # provider-reported cost where available

[payload]                   # deterministic chunking caps (chars)
max_total_chars = 240000
max_diff_chars = 120000
max_file_chars = 20000
max_test_output_chars = 20000
max_handoff_chars = 20000
max_context_chars = 30000
max_untracked_file_chars = 10000
# context_file = "tools/ai_collab/context/project_context.md"

[git]
protected_branches = ["main", "master"]
require_clean = true        # refuse to start on a dirty tree unless --allow-dirty

[tests]
# Argv lists run from the repo root by the orchestrator (recorded to tests.txt).
commands = [[".venv/Scripts/python.exe", "-m", "pytest", "-q"]]
timeout_seconds = 1800

[graphify]
enabled = false             # optional targeted architecture notes for the reviewer
# commands = [["graphify", "explain", "autograder/gateway.py"]]
timeout_seconds = 120

[redaction]
extra_deny_globs = []       # extra secret-file patterns to exclude from diffs
extra_patterns = []         # extra regexes scrubbed from every payload/artifact
