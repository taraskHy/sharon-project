# Model gateway configuration — copy to models.toml (gitignored) and edit.
# Every task maps to a backend + model. Model slugs come from configuration
# only; ${ENV_VAR} references are expanded at load time and OpenRouter tasks
# with an unset variable fail loudly at gateway construction.
#
# Backends: openrouter | ollama (OpenAI-compatible endpoint) | mock
# The OpenRouter key is read ONLY from the OPENROUTER_API_KEY environment
# variable — never put it in this file.

[defaults]
structured_mode = "json_schema"
temperature = 0.0
timeout_s = 300.0

# ---- cloud tasks (OpenRouter) — slugs deliberately left to the environment ----
#
# Role states:
#   model = "${SOME_MODEL}"  chosen via environment; an ENABLED task whose
#                            variable is unset fails loudly at load time.
#   model = "UNSELECTED"     model selection pending: the config loads, but
#                            any run/benchmark that needs the role refuses
#                            with a pointer to the candidate registry
#                            (evaluation/model_selection/candidates.toml).
# No cloud role has a default model: winners are chosen empirically per role.

[models.ocr_primary]
backend = "openrouter"
model = "${OCR_PRIMARY_MODEL}"
max_tokens = 400
reasoning = { effort = "none" }        # routine OCR: no reasoning
prompt_version = "ocr-v1"

[models.ocr_verify]
backend = "openrouter"
model = "${OCR_VERIFY_MODEL}"
max_tokens = 400
reasoning = { effort = "low" }
prompt_version = "ocr-verify-v1"

[models.grade_primary]
backend = "openrouter"
model = "${GRADE_PRIMARY_MODEL}"
# Must equal GradeAdapter.default_max_tokens: the benchmark that SELECTS this
# model and this route emit the same prompt and the same GradeResult schema, so
# a different output budget would mean selecting on one cap and deploying on
# another (tests/test_production_benchmark_parity.py pins this). It also matches
# grade_escalate, which uses the identical schema — a truncated response is a
# schema failure, i.e. a silent REVIEW.
max_tokens = 600
reasoning = { effort = "none" }
prompt_version = "grade-v4-charitable"

[models.grade_escalate]
backend = "openrouter"
model = "${GRADE_ESCALATE_MODEL}"
max_tokens = 600
reasoning = { effort = "high" }        # reasoning reserved for escalation
prompt_version = "grade-v4-charitable"

[models.mc_resolve_cloud]
backend = "openrouter"
model = "${MC_RESOLVE_CLOUD_MODEL}"
max_tokens = 120
reasoning = { effort = "none" }
prompt_version = "mc-v1"

[models.variant_resolve_cloud]
backend = "openrouter"
model = "${VARIANT_RESOLVE_CLOUD_MODEL}"
max_tokens = 300
prompt_version = "variant-v1"

# ---- local auxiliary tasks (Ollama, thinking disabled) ----

[models.mc_resolve]
backend = "ollama"
base_url = "http://localhost:11434/v1"
model = "qwen3.8:27b-q4_K_M"
max_tokens = 120
extra_generation = { think = false }
prompt_version = "mc-v1"

[models.variant_resolve]
backend = "ollama"
base_url = "http://localhost:11434/v1"
model = "qwen3.8:27b-q4_K_M"
max_tokens = 300
extra_generation = { think = false }
prompt_version = "variant-v1"

[models.policy_infer]
backend = "ollama"
base_url = "http://localhost:11434/v1"
model = "qwen3.8:27b-q4_K_M"
max_tokens = 300
extra_generation = { think = false }
prompt_version = "policy-v1"

# ---- optional tasks referenced by code but disabled until configured ----
# alignment.model_align_question tries align_resolve (local) then
# align_resolve_cloud; discovery.resolve_policy_with_models tries
# policy_infer then policy_infer_cloud. Absent routes are simply skipped
# (deterministic/identity fallbacks + review flags); uncomment to enable.
#
# [models.align_resolve]
# backend = "ollama"
# base_url = "http://localhost:11434/v1"
# model = "qwen3.8:27b-q4_K_M"
# max_tokens = 300
# extra_generation = { think = false }
# prompt_version = "align-v1"
#
# [models.align_resolve_cloud]
# backend = "openrouter"
# model = "UNSELECTED"          # or "${ALIGN_RESOLVE_CLOUD_MODEL}"
# max_tokens = 300
# prompt_version = "align-v1"
#
# [models.policy_infer_cloud]
# backend = "openrouter"
# model = "UNSELECTED"          # or "${POLICY_INFER_CLOUD_MODEL}"
# max_tokens = 300
# prompt_version = "policy-v1"

# ---- budgets (0 or omitted = unlimited; enabled=false disables enforcement) ----

[budget]
enabled = true
max_calls_per_job = 0
max_calls_per_exam = 0
max_input_tokens_per_job = 0
max_output_tokens_per_job = 0
max_cost_per_job = 0
# Cross-RUN hard ceiling on cumulative reported cost, summed over this state
# root's persisted gateway ledger — set 10.00 for the model-selection
# campaign ($8 warning via soft_fraction 0.8). All campaign runs must share
# ONE state root so one ledger carries the total; with a [pricing] entry for
# the model, the call that WOULD cross the ceiling is refused up front.
max_cost_total = 0
max_calls_per_day = 0
max_calls_per_month = 0
soft_fraction = 0.8

# ---- local pricing table (ESTIMATOR ONLY; never fetched from the network) ----
# USD per 1M tokens. Without this table the pre-run estimator shows call and
# token counts but no dollar figure — it never guesses a price.
#
# [pricing."vendor/model-slug"]
# input = 0.15
# output = 0.60
